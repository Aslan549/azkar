<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DFE6E2">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Азкары</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow reading column; sticky header with section switch + progress; each dhikr is a tappable card with its own counter ring. */
:root {
  --bg: #DFE6E2;
  --surface: #F2F5F3;
  --ink: #16201C;
  --muted: #56635E;
  --line: #C8D2CD;
  --m: #A8640F;   /* утро: рассвет */
  --e: #3D4C9E;   /* вечер: сумерки */
  --p: #1C7356;   /* после намаза */
  --d: #8A3B5C;   /* дуа */
  --j: #0F6A78;   /* пятница */
  --accent: var(--m);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --done-bg: #D5DDD9;
  --f-ar: "Amiri", "Scheherazade New", "Traditional Arabic", "Noto Naskh Arabic", serif;
  --f-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ar-size: 1.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #161E1B; --ink: #E5ECE8; --muted: #93A29C; --line: #26312D;
    --m: #E3A54A; --e: #8C9BF0; --p: #4FC197; --d: #E58FB0; --j: #5CC4D4; --done-bg: #131A17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #161E1B; --ink: #E5ECE8; --muted: #93A29C; --line: #26312D;
  --m: #E3A54A; --e: #8C9BF0; --p: #4FC197; --d: #E58FB0; --j: #5CC4D4; --done-bg: #131A17; color-scheme: dark;
}
/* Выбранный цвет страниц: действует при любой системной теме. */
:root[data-skin="sand"] {
  --bg: #E4D9C3; --surface: #F1E9D9; --ink: #2A2317; --muted: #6B5E4C; --line: #D1C3A9; --done-bg: #DBCFB7;
  --m: #965609; --e: #3B4787; --p: #2C6646; --d: #8A3553; --j: #1B6470; color-scheme: light;
}
:root[data-skin="olive"] {
  --bg: #C9D2BA; --surface: #E1E6D4; --ink: #1D2317; --muted: #515B45; --line: #B2BCA1; --done-bg: #C0C9AF;
  --m: #85500A; --e: #34437C; --p: #2A5A2C; --d: #7E3150; --j: #195B66; color-scheme: light;
}
:root[data-skin="night"] {
  --bg: #0F1724; --surface: #172234; --ink: #E6EAF2; --muted: #95A1B7; --line: #26334B; --done-bg: #121B2A;
  --m: #E8B259; --e: #9EAAF5; --p: #5CC9A0; --d: #EC9BBB; --j: #6CCFDD; color-scheme: dark;
}
:root[data-mode="e"] { --accent: var(--e); }
:root[data-mode="p"] { --accent: var(--p); }
:root[data-mode="d"] { --accent: var(--d); }
:root[data-mode="j"] { --accent: var(--j); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 10px; display: grid; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.tools { flex-wrap: wrap; }
.skins { display: flex; gap: 8px; align-items: center; }
.skins span { font-size: 0.8rem; color: var(--muted); margin-right: 2px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; position: relative; }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sw[data-skin="default"] { background: linear-gradient(135deg, #DFE6E2 50%, #161E1B 50%); }
.sw[data-skin="sand"] { background: #E4D9C3; }
.sw[data-skin="olive"] { background: #C9D2BA; }
.sw[data-skin="night"] { background: #0F1724; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
h1 .logo { font-family: var(--f-ar); font-weight: 700; font-size: 1.6rem; color: var(--accent); }
.intro-top { padding-block: 16px 12px; display: grid; gap: 12px; }
.tools { display: flex; gap: 6px; }
.tool { font: inherit; font-size: 0.85rem; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.tool[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.tool:focus-visible, .seg button:focus-visible, .chip:focus-visible, .card:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.seg { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { font: inherit; font-weight: 600; font-size: 0.88rem; line-height: 1.25; border: 0; background: transparent; color: var(--muted); padding: 8px 2px; border-radius: 8px; cursor: pointer; min-width: 0; }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--surface); }

.prog { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

.prayers { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

main .wrap { padding-block: 18px 48px; display: grid; gap: 14px; }
.intro { color: var(--muted); font-size: 0.88rem; margin: 0 0 4px; max-width: 62ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; display: grid; gap: 12px; cursor: pointer; user-select: none; transition: background .2s, opacity .2s; min-width: 0; }
.card:active { background: var(--accent-soft); }
.card.static { cursor: default; user-select: text; }
.card.static:active { background: var(--surface); }
.card.info { gap: 8px; }
.itext { margin: 0; color: var(--ink); max-width: 65ch; }
.card.info .chead h2 { text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--ink); }
.group { margin: 10px 0 -2px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.card.done { background: var(--done-bg); opacity: .62; }
.card.done .ar { color: var(--muted); }
.chead { display: flex; align-items: center; gap: 10px; }
.chead h2 { margin: 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); flex: 1; min-width: 0; }
.times { font-size: 0.8rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.card.done .times { color: var(--muted); background: transparent; }
.ar { font-family: var(--f-ar); font-size: var(--ar-size); line-height: 2.05; direction: rtl; text-align: right; margin: 0; overflow-wrap: anywhere; }
.tl { margin: 0; font-size: 1.02rem; font-weight: 500; line-height: 1.55; color: color-mix(in srgb, var(--accent) 70%, var(--ink)); max-width: 65ch; }
.card.done .tl { color: var(--muted); }
.ru { margin: 0; color: var(--ink); max-width: 65ch; }
body.no-tr .ru, body.no-tl .tl { display: none; }
.fadl { margin: 0; font-size: 0.86rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; max-width: 65ch; }
.cfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.ctr { margin-left: auto; }
.src { font-size: 0.8rem; color: var(--muted); min-width: 0; }
.ctr { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.play { font: inherit; font-size: 0.82rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; border-radius: 999px; padding: 6px 12px 6px 10px; cursor: pointer; white-space: nowrap; }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.play.on { background: var(--accent); color: var(--surface); }
.play:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.part { display: grid; gap: 8px; min-width: 0; }
.part + .part { border-top: 1px solid var(--line); padding-top: 12px; }
.part h3 { margin: 0; font-size: 0.88rem; font-weight: 600; color: var(--accent); }
.card.done .part h3 { color: var(--muted); }
.arow { display: flex; padding-top: 2px; }
.anote { margin: 0; font-size: 0.8rem; color: var(--muted); }
/* Заучивание */
.memo { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.memo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.memo-row > span { font-size: 0.82rem; color: var(--muted); min-width: 7.5em; }
.memo-hint { margin: 0; font-size: 0.8rem; color: var(--muted); }
body.memo-hide .card .tl:not(.shown), body.memo-hide .card .ru:not(.shown) { filter: blur(6px); cursor: pointer; user-select: none; }
body.memo-hide .card .tl:not(.shown)::selection { background: transparent; }

/* Серия дней */
.streak { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.st-label { font-size: 0.8rem; color: var(--muted); }
.st { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px; font-size: 0.8rem; white-space: nowrap; }
.st b { font-variant-numeric: tabular-nums; }
.st .dots { display: flex; gap: 3px; }
.st .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.st .dots i.on { background: var(--st); }
.st.m { --st: var(--m); } .st.e { --st: var(--e); }

/* Избранное */
.fav { font: inherit; font-size: 1.15rem; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.fav[aria-pressed="true"] { color: var(--accent); }
.fav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; border: 1px dashed var(--line); border-radius: 14px; }

/* Пятница */
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; background: color-mix(in srgb, var(--j) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--j) 40%, var(--line)); border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; }
.banner button { font: inherit; font-weight: 600; font-size: 0.85rem; color: var(--surface); background: var(--j); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tally { font: inherit; font-weight: 600; font-size: 0.9rem; color: var(--surface); background: var(--accent); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-variant-numeric: tabular-nums; }
.tally:active { transform: scale(.97); }
.kbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.ktoggle { font: inherit; font-size: 0.82rem; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.ayahs { display: grid; gap: 0; border-top: 1px solid var(--line); }
.ayah { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ayah.now { background: var(--accent-soft); margin-inline: -16px; padding-inline: 16px; }
.ayah .ar { font-size: var(--ar-size); }
.ayah .num { font-size: 0.75rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.kru { margin: 0; font-size: 0.92rem; color: var(--ink); max-width: 65ch; }
body.no-tr .kru { display: none; }
.basmala { text-align: center; font-family: var(--f-ar); font-size: calc(var(--ar-size) * 1.05); margin: 4px 0 8px; }
.credits { margin: 8px 0 0; font-size: 0.78rem; color: var(--muted); text-align: center; }
.reset { font: inherit; font-size: 0.78rem; color: var(--muted); background: none; border: 0; padding: 6px; cursor: pointer; border-radius: 6px; }
.reset[hidden] { display: none; }
.ring { position: relative; width: 52px; height: 52px; }
.ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .trk { stroke: var(--line); }
.ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .2s ease; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.card.done .ring b { color: var(--accent); font-size: 1.2rem; }

.finish { text-align: center; padding: 28px 16px; border: 1px dashed var(--accent); border-radius: 14px; background: var(--accent-soft); }
.finish .ar { text-align: center; font-size: 1.9rem; color: var(--accent); }
.finish p { margin: 4px 0 0; color: var(--muted); }
.clear { margin-top: 14px; }

@media (max-width: 420px) {
  h1 { font-size: 1.15rem; }
  .ar { line-height: 1.95; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap intro-top">
    <div class="top">
      <h1><span class="logo" lang="ar">أذكار</span>Азкары</h1>
      <div class="tools">
        <button class="tool" id="fs-dec" aria-label="Уменьшить арабский шрифт">A−</button>
        <button class="tool" id="fs-inc" aria-label="Увеличить арабский шрифт">A+</button>
        <button class="tool" id="tlb" aria-pressed="true">Транскрипция</button>
        <button class="tool" id="tr" aria-pressed="true">Перевод</button>
        <button class="tool" id="memo-btn" aria-pressed="false" aria-controls="memo">Заучивание</button>
      </div>
    </div>
    <div class="skins" id="skins">
      <span>Цвет:</span>
      <button class="sw" id="sw-default" data-skin="default" aria-label="Основной (светлый или тёмный по системе)" title="Основной"></button>
      <button class="sw" id="sw-sand" data-skin="sand" aria-label="Песок" title="Песок"></button>
      <button class="sw" id="sw-olive" data-skin="olive" aria-label="Олива" title="Олива"></button>
      <button class="sw" id="sw-night" data-skin="night" aria-label="Ночь" title="Ночь"></button>
    </div>
    <div class="memo" id="memo" hidden>
      <div class="memo-row" id="memo-rep"><span>Повтор аудио:</span>
        <button class="chip" id="rep-1" data-rep="1">1 раз</button>
        <button class="chip" id="rep-3" data-rep="3">3 раза</button>
        <button class="chip" id="rep-5" data-rep="5">5 раз</button>
        <button class="chip" id="rep-10" data-rep="10">10 раз</button>
      </div>
      <div class="memo-row" id="memo-rate"><span>Скорость:</span>
        <button class="chip" id="rate-75" data-rate="0.75">Медленно</button>
        <button class="chip" id="rate-100" data-rate="1">Обычно</button>
      </div>
      <div class="memo-row"><span>Проверь себя:</span>
        <button class="chip" id="hide-chk" aria-pressed="false">Скрыть транскрипцию и перевод</button>
      </div>
      <p class="memo-hint">Скрытый текст открывается нажатием. В суре «Аль-Кахф» повтор действует на каждый аят отдельно.</p>
    </div>
    <div class="streak" id="streak"></div>
</div>
<header>
  <div class="wrap">
    <div class="seg" role="tablist">
      <button role="tab" id="tab-m" data-mode="m">Утро</button>
      <button role="tab" id="tab-e" data-mode="e">Вечер</button>
      <button role="tab" id="tab-p" data-mode="p">После намаза</button>
      <button role="tab" id="tab-d" data-mode="d">Дуа</button>
      <button role="tab" id="tab-j" data-mode="j">Пятница</button>
    </div>
    <div class="prayers" id="prayers" hidden></div>
    <div class="prog"><div class="bar"><i id="bar"></i></div><span id="pct">0 / 0</span></div>
  </div>
</header>

<main><div class="wrap" id="list"></div></main>

<script>
const PRAYERS = [["fajr","Фаджр"],["zuhr","Зухр"],["asr","Аср"],["maghrib","Магриб"],["isha","Иша"]];

const KURSI_AR = "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ";
const KURSI_RU = "Аллах — нет божества, кроме Него, Живого, Вседержителя. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает то, что было до них, и то, что будет после них. Они постигают из Его знания лишь то, что Он пожелает. Его Престол объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.";
const IKHLAS_AR = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ";

    if (!x.n) return head + `<article class="card static" data-id="${x.id}" data-n="0" aria-label="${esc(x.t)}">
      <div class="chead"><h2>${esc(x.t)}</h2>${x.times ? `<span class="times">${x.times}</span>` : ""}${fav}</div>

function kahfHtml() {
  if (!kahf) return `<p class="itext">Загрузка текста…</p>`;
  return `<p class="basmala" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p><div class="ayahs">` +

function openKahf() {
  kahfOpen = !kahfOpen;
  const box = $("#kahf-text"), btn = $("#kahf-toggle");
  box.hidden = !kahfOpen;
  btn.textContent = kahfOpen ? "Скрыть текст" : "Показать текст суры";

    .catch(() => {
      box.innerHTML = `<p class="itext">Не удалось загрузить текст суры. Проверьте интернет и нажмите «Показать текст суры» ещё раз.</p>`;
      kahfOpen = false; btn.textContent = "Показать текст суры"; btn.setAttribute("aria-expanded", false);
    });
}

// ---------- audio ----------
const player = new Audio();
player.preload = "none";
// playing: { id, queue, i — текущий файл, r — номер повтора, perItem — повторять каждый файл (аяты суры) }
let playing = null;

function setPlayBtn(id, on) {
  const b = document.getElementById("play-" + id);
  if (!b) return;
  b.classList.toggle("on", on);
  b.innerHTML = on ? PAUSE_ICON + "Пауза" + (rep > 1 && playing ? ` · ${playing.r + 1}/${rep}` : "") : PLAY_ICON + b.dataset.label;
}
function markAyah() {
  document.querySelectorAll(".ayah.now").forEach(el => el.classList.remove("now"));
  if (!playing || !playing.perItem || !playing.i) return;
  const el = document.getElementById("ayah-" + playing.i);
  if (el) { el.classList.add("now"); el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }); }
}
function stopAudio() {
  player.pause();
  if (playing) setPlayBtn(playing.id, false);
  playing = null;
  markAyah();
}
function loadCurrent(scroll) {
  player.src = "audio/" + playing.queue[playing.i] + ".mp3";
  player.defaultPlaybackRate = player.playbackRate = rate;
  player.play().catch(() => stopAudio());
  setPlayBtn(playing.id, true);
  if (scroll) markAyah();
}
function playItem(id, start) {
  if (playing && playing.id === id && start == null) {
    if (player.paused) { player.play().catch(() => {}); setPlayBtn(id, true); }
    else { player.pause(); setPlayBtn(id, false); }
    return;
  }
  stopAudio();
  playing = { id, queue: audioOf(id), i: start || 0, r: 0, perItem: id === "j-kahf" };
  loadCurrent(true);
}
player.addEventListener("ended", () => {
  if (!playing) return;
  const p = playing;
  if (p.perItem) {
    if (++p.r < rep) return loadCurrent(false);
    p.r = 0;
    if (++p.i < p.queue.length) return loadCurrent(true);
    return stopAudio();
  }
  if (++p.i < p.queue.length) return loadCurrent(false);
  if (++p.r < rep) { p.i = 0; return loadCurrent(false); }
  stopAudio();
});
player.addEventListener("error", () => { if (playing) stopAudio(); });

function updateCard(el) {
  const n = +el.dataset.n, c = Math.min(counts[el.dataset.id] || 0, n);
  el.classList.toggle("done", c >= n);
  el.querySelector(".val").style.strokeDashoffset = C * (1 - c / n);
  el.querySelector(".ring b").textContent = c >= n ? "✓" : n - c;
  el.querySelector(".reset").hidden = !c;
}

function progress() {
  const its = items();
  const done = its.filter(x => (counts[x.id] || 0) >= x.n).length;
  $("#bar").style.width = (its.length ? done / its.length * 100 : 0) + "%";
  $("#pct").textContent = done + " / " + its.length;
  $("#finish").hidden = !(mode === "m" || mode === "e" || mode === "p") || done < its.length;
  if (mode === "m" || mode === "e") {
    const k = "azkar:days:" + mode, days = store.get(k, []), t = today(), has = days.includes(t), full = done === its.length;
    if (full && !has) store.set(k, [...days, t].slice(-400));
    if (!full && has) store.set(k, days.filter(d => d !== t));
  }
  renderStreak();
}

// Серия: сколько дней подряд раздел прочитан полностью. Если сегодня ещё не прочитан, серия считается до вчера.
function streakOf(m) {
  const days = new Set(store.get("azkar:days:" + m, []));
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  const week = [];
  for (let i = 6; i >= 0; i--) { const x = new Date(); x.setDate(x.getDate() - i); week.push(days.has(dayKey(x))); }
  return { n, week };
}
function renderStreak() {
  $("#streak").innerHTML = [["m", "Утро"], ["e", "Вечер"]].map(([m, name]) => {
    const s = streakOf(m);
    return `<div class="st ${m}" title="Дней подряд; точки — последние 7 дней">
      <span>${name} подряд: <b>${s.n}</b></span>
      <span class="dots" aria-label="Последние 7 дней">${s.week.map(on => `<i${on ? ' class="on"' : ""}></i>`).join("")}</span>
    </div>`;
  }).join("");
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

list.addEventListener("click", e => {
  if (e.target.id === "clear-all") { counts = {}; store.set(key(), counts); render(); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); return; }
  if (e.target.id === "go-friday") { mode = "j"; store.set("azkar:mode", mode); render(); scrollTo({ top: 0 }); return; }
  const card = e.target.closest(".card");
  if (!card) return;
  const id = card.dataset.id, n = +card.dataset.n;
  if (e.target.closest(".play")) { playItem(id); return; }
  if (e.target.id === "kahf-toggle") { openKahf(); return; }
  const ayah = e.target.closest(".ayah");
  if (ayah) { playItem("j-kahf", +ayah.dataset.ayah); return; }
  const fav = e.target.closest(".fav");
  if (fav) {
    favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
    store.set("azkar:fav", favs);
    if (mode === "d" && cat === "f") return render();
    fav.setAttribute("aria-pressed", favs.includes(id));
    fav.textContent = favs.includes(id) ? "★" : "☆";
    return;
  }
  const tally = e.target.closest(".tally");
  if (tally) {
    const k = "azkar:sal:" + today(), t = store.get(k, 0) + 1;
    store.set(k, t);
    tally.textContent = "+1 салават · сегодня " + t;
    try { navigator.vibrate && navigator.vibrate(t % 100 === 0 ? 40 : 8); } catch {}
    return;
  }
  const hidden = document.body.classList.contains("memo-hide") && e.target.closest(".tl:not(.shown), .ru:not(.shown)");
  if (hidden) { hidden.classList.add("shown"); return; }
  if (!n) return;
  if (e.target.closest(".reset")) { delete counts[id]; store.set(key(), counts); updateCard(card); progress(); return; }
  if ((counts[id] || 0) >= n) return;
  counts[id] = (counts[id] || 0) + 1;
  store.set(key(), counts);
  try { navigator.vibrate && navigator.vibrate(counts[id] >= n ? 30 : 8); } catch {}
  updateCard(card);
  progress();
  if (counts[id] >= n) {
    const next = [...list.querySelectorAll(".card:not(.done)")].find(c => c.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_PRECEDING)
      || list.querySelector(".card:not(.done)");
    const target = next || $("#finish");
    setTimeout(() => target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }), 250);
  }
});
list.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); e.target.click(); }
});

document.querySelector(".seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode; store.set("azkar:mode", mode); render(); scrollTo({ top: 0 });
});
$("#prayers").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.c) { cat = b.dataset.c; store.set("azkar:cat", cat); }
  else prayer = b.dataset.p;
  render();
});

function applyPrefs() {
  document.documentElement.style.setProperty("--ar-size", arSize + "rem");
  document.body.classList.toggle("no-tr", !showTr);
  $("#tr").setAttribute("aria-pressed", showTr);
  document.body.classList.toggle("no-tl", !showTl);
  $("#tlb").setAttribute("aria-pressed", showTl);
  if (skin === "default") delete document.documentElement.dataset.skin;
  else document.documentElement.dataset.skin = skin;
  document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", b.dataset.skin === skin));
  document.body.classList.toggle("memo-hide", hideChk);
  $("#hide-chk").setAttribute("aria-pressed", hideChk);
  $("#memo").hidden = !memoOpen;
  $("#memo-btn").setAttribute("aria-pressed", memoOpen);
  document.querySelectorAll("#memo-rep .chip").forEach(b => b.setAttribute("aria-pressed", +b.dataset.rep === rep));
  document.querySelectorAll("#memo-rate .chip").forEach(b => b.setAttribute("aria-pressed", +b.dataset.rate === rate));
}
$("#memo-btn").onclick = () => { memoOpen = !memoOpen; applyPrefs(); };
$("#memo-rep").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  rep = +b.dataset.rep; store.set("azkar:rep", rep); applyPrefs();
  if (playing) setPlayBtn(playing.id, !player.paused);
});
$("#memo-rate").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  rate = +b.dataset.rate; store.set("azkar:rate", rate); player.playbackRate = rate; applyPrefs();
});
$("#hide-chk").onclick = () => {
  hideChk = !hideChk; store.set("azkar:hide", hideChk);
  document.querySelectorAll(".shown").forEach(el => el.classList.remove("shown"));
  applyPrefs();
};
$("#skins").addEventListener("click", e => {
  const b = e.target.closest(".sw"); if (!b) return;
  skin = b.dataset.skin; store.set("azkar:skin", skin); applyPrefs();
});
$("#tlb").onclick = () => { showTl = !showTl; store.set("azkar:tl", showTl); applyPrefs(); };
$("#fs-inc").onclick = () => { arSize = Math.min(3, +(arSize + 0.15).toFixed(2)); store.set("azkar:ar", arSize); applyPrefs(); };
$("#fs-dec").onclick = () => { arSize = Math.max(1.2, +(arSize - 0.15).toFixed(2)); store.set("azkar:ar", arSize); applyPrefs(); };
$("#tr").onclick = () => { showTr = !showTr; store.set("azkar:tr", showTr); applyPrefs(); };

applyPrefs();
render();
</script>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return;
  tg.ready();
  tg.expand();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("azkar:skin")); } catch (e) {}
  if ((!saved || saved === "default") && tg.colorScheme === "dark") document.documentElement.dataset.theme = "dark";
  const paint = () => {
    const bg = getComputedStyle(document.body).backgroundColor;
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
  };
  paint();
  document.getElementById("skins").addEventListener("click", () => setTimeout(paint, 0));
  const start = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const tab = start && document.getElementById("tab-" + start);
  if (tab) tab.click();
})();
</script>
</body>
</html>
