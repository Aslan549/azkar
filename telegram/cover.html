<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обложка Mini App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Golos+Text:wght@500;700&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 640px; height: 360px; overflow: hidden; background: #0F1724; color: #E6EAF2; font-family: "Golos Text", system-ui, sans-serif; display: grid; place-items: center; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(circle at 78% 18%, rgba(232,178,89,.28), transparent 42%), radial-gradient(circle at 15% 85%, rgba(92,201,160,.18), transparent 45%); }
  .wrap { position: relative; text-align: center; }
  .ar { font-family: "Amiri", serif; font-size: 112px; line-height: 1.1; color: #E8B259; }
  .ru { font-size: 40px; font-weight: 700; letter-spacing: .02em; margin-top: 4px; }
  .sub { font-size: 18px; color: #95A1B7; margin-top: 10px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="ar">أذكار</div>
    <div class="ru">Азкары</div>
    <div class="sub">утро · вечер · после намаза · дуа · пятница</div>
  </div>
</body>
</html>
